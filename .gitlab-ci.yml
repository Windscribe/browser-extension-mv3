default:
  image: digitalcatharsis/gitlab-ci-puppeteer-headful:latest

variables:
  CI: "true"

stages:
  - lint
  - build
  - test

eslint:
  stage: lint
  script:
  - yarn install --frozen-lockfile
  - yarn run lint
  artifacts:
    paths:
      - node_modules/
    expire_in: 7 days

build:
  stage: build
  needs:
    - job: eslint
  before_script:
    - echo "checking node version"
    - node -v
  script:
  - printf "\nNODE_ENV=CI" >> ".env"
  - yarn run build 
  artifacts:
    paths:
      - build/
    expire_in: 7 days

test:
  stage: test
  needs:
    - job: eslint
    - job: build
  script:
    - Xvfb -ac :99 -screen 0 1280x1024x16 > /dev/null 2>&1 & # Start virtual display
    - yarn run test