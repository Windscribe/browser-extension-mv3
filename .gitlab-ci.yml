image:
  name: ${DOCKER_REPO}:${CI_COMMIT_REF_SLUG}
  entrypoint:
    - '/usr/bin/env'
    - 'PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin'

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - when: always

variables:
  DOCKER_REPO: registry.gitlab.int.windscribe.com:5005/ws/client/extension-mv3
  DOCKERFILE: e2e.Dockerfile

stages:
  - prepare-environment
  - lint
  - build
  - test

build:image:
  image: docker
  stage: prepare-environment
  rules:
    # - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - ${DOCKERFILE}
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_JOB_TOKEN $CI_REGISTRY
    - docker build -f ${DOCKERFILE} -t ${DOCKER_REPO}:${CI_COMMIT_REF_SLUG} .
    - docker push ${DOCKER_REPO}:${CI_COMMIT_REF_SLUG}

eslint:
  stage: lint
  script:
  - yarn install --frozen-lockfile
  - yarn run lint
  artifacts:
    paths:
      - node_modules/
    expire_in: 7 days

build:extension:
  stage: build
  needs:
    - job: eslint
  before_script:
    - echo "checking node version"
    - node -v
  script:
  - printf "\nNODE_ENV=CI" >> ".env"
  - yarn run build 
  artifacts:
    paths:
      - build/
    expire_in: 7 days

test:
  stage: test
  needs:
    - job: eslint
    - job: build:extension
  script:
    - Xvfb -ac :99 -screen 0 1280x1024x16 > /dev/null 2>&1 & # Start virtual display
    - yarn run test